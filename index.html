<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Birthday Party</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-photo-frame hero-photo-frame-left" id="hero-photo-frame-left" aria-hidden="true">
    <div class="frame-inner">
      <img id="frame-img-c" alt="">
      <img id="frame-img-d" alt="">
    </div>
  </div>
  <div class="hero-photo-frame" id="hero-photo-frame" aria-hidden="true">
    <div class="frame-inner">
      <img id="frame-img-a" alt="">
      <img id="frame-img-b" alt="">
    </div>
  </div>
  <svg class="hero-scene" viewBox="0 0 800 260" aria-hidden="true">
    <!-- confetti dots -->
    <g>
      <circle cx="60" cy="40" r="5" fill="var(--orange)"/>
      <circle cx="140" cy="20" r="4" fill="var(--sky)"/>
      <circle cx="380" cy="30" r="5" fill="var(--gold)"/>
      <circle cx="460" cy="15" r="4" fill="var(--green)"/>
      <circle cx="600" cy="35" r="5" fill="var(--navy)"/>
      <circle cx="20" cy="120" r="4" fill="var(--green)"/>
      <circle cx="780" cy="60" r="5" fill="var(--orange)"/>
    </g>

    <!-- dashed track -->
    <path d="M0 230 Q200 200 400 230 T800 230" stroke="var(--navy)" stroke-width="3" stroke-dasharray="10 10" fill="none" opacity="0.3"/>

    <!-- pinwheel (with dust trail) — curved petal blades -->
    <g transform="translate(95,110)">
      <g class="dust-trail">
        <circle cx="-55" cy="30" r="14" fill="#E3E6EC"/>
        <circle cx="-72" cy="22" r="10" fill="#EDEFF3"/>
        <circle cx="-40" cy="42" r="11" fill="#D8DBE2"/>
        <circle cx="-85" cy="35" r="8" fill="#EDEFF3"/>
        <circle cx="-60" cy="48" r="9" fill="#CBD0DA"/>
      </g>
    </g>
    <g transform="translate(95,110)">
      <g class="pinwheel-l">
        <path d="M0 0 L0 -55 Q35 -55 0 0 Z" fill="var(--sky)"/>
        <path d="M0 0 L55 0 Q55 35 0 0 Z" fill="var(--gold)"/>
        <path d="M0 0 L0 55 Q-35 55 0 0 Z" fill="var(--green)"/>
        <path d="M0 0 L-55 0 Q-55 -35 0 0 Z" fill="var(--orange)"/>
      </g>
      <circle cx="0" cy="0" r="7" fill="var(--navy)"/>
      <rect x="-3" y="0" width="6" height="90" rx="3" fill="#B98A4E"/>
    </g>

    <!-- monster truck tire — fills the empty gap between pinwheel and gear -->
    <g transform="translate(230,150)">
      <circle r="40" fill="var(--ink)"/>
      <g fill="#2A2F3A">
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(0)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(36)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(72)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(108)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(144)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(180)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(216)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(252)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(288)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(324)"/>
      </g>
      <circle r="24" fill="#B7BDC6"/>
      <circle r="24" fill="none" stroke="#8A919C" stroke-width="2"/>
      <g stroke="#6B7280" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(0)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(72)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(144)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(216)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(288)"/>
      </g>
      <circle r="7" fill="#5B6570"/>
      <circle r="3" fill="var(--ink)"/>
    </g>

    <!-- second pinwheel — sharp angular blades, opposite spin -->
    <g transform="translate(195,60) scale(0.65)">
      <g class="pinwheel-r">
        <path d="M0 0 L-14 -50 L18 -46 Z" fill="var(--navy)"/>
        <path d="M0 0 L50 -14 L46 18 Z" fill="var(--orange)"/>
        <path d="M0 0 L14 50 L-18 46 Z" fill="var(--sky)"/>
        <path d="M0 0 L-50 14 L-46 -18 Z" fill="var(--green)"/>
      </g>
      <circle cx="0" cy="0" r="6" fill="var(--gold)"/>
    </g>

    <!-- gear (left-center) -->
    <g transform="translate(300,200)">
      <g class="gear-spin">
        <circle r="26" fill="var(--green)"/>
        <circle r="10" fill="var(--cream)"/>
        <g fill="var(--green)">
          <rect x="-6" y="-38" width="12" height="16" rx="3"/>
          <rect x="-6" y="22" width="12" height="16" rx="3"/>
          <rect x="-38" y="-6" width="16" height="12" rx="3"/>
          <rect x="22" y="-6" width="16" height="12" rx="3"/>
        </g>
      </g>
    </g>

    <!-- accent wheel (left) — treaded tire, 4-spoke -->
    <g transform="translate(160,225)">
      <circle r="30" fill="var(--ink)"/>
      <g fill="var(--ink)">
        <rect x="-3" y="-33" width="6" height="7"/>
        <rect x="-3" y="26" width="6" height="7"/>
        <rect x="-33" y="-3" width="7" height="6"/>
        <rect x="26" y="-3" width="7" height="6"/>
      </g>
      <circle r="19" fill="var(--sky)"/>
      <g stroke="var(--ink)" stroke-width="2.5">
        <line x1="-14" y1="0" x2="14" y2="0"/>
        <line x1="0" y1="-14" x2="0" y2="14"/>
        <line x1="-10" y1="-10" x2="10" y2="10"/>
        <line x1="-10" y1="10" x2="10" y2="-10"/>
      </g>
      <circle r="5" fill="var(--ink)"/>
    </g>

    <!-- tiny accent tire (left) — plain hubcap, no spokes -->
    <g transform="translate(45,155) scale(0.55)">
      <circle r="26" fill="var(--ink)"/>
      <circle r="17" fill="var(--orange)"/>
      <circle r="9" fill="var(--ink)" opacity="0.15"/>
      <circle r="5" fill="var(--ink)"/>
    </g>

    <!-- spinning top -->
    <g transform="translate(430,215)" class="top-wobble">
      <path d="M-22 -20 L22 -20 L10 30 Q0 40 -10 30 Z" fill="var(--orange)"/>
      <rect x="-22" y="-30" width="44" height="12" rx="6" fill="var(--sky)"/>
      <rect x="-4" y="-42" width="8" height="14" rx="4" fill="var(--navy)"/>
    </g>

    <!-- monster truck tire (right) -->
    <g transform="translate(470,105) scale(0.65)">
      <circle r="40" fill="var(--ink)"/>
      <g fill="#2A2F3A">
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(0)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(36)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(72)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(108)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(144)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(180)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(216)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(252)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(288)"/>
        <rect x="-6" y="-42" width="12" height="10" rx="2" transform="rotate(324)"/>
      </g>
      <circle r="24" fill="#B7BDC6"/>
      <circle r="24" fill="none" stroke="#8A919C" stroke-width="2"/>
      <g stroke="#6B7280" stroke-width="5" stroke-linecap="round">
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(0)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(72)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(144)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(216)"/>
        <line x1="0" y1="0" x2="0" y2="-16" transform="rotate(288)"/>
      </g>
      <circle r="7" fill="#5B6570"/>
      <circle r="3" fill="var(--ink)"/>
    </g>

    <!-- third pinwheel — six slim blades, larger -->
    <g transform="translate(555,55) scale(0.7)">
      <g class="pinwheel-l">
        <path d="M0 0 L-9 -50 Q0 -56 9 -50 Z" fill="var(--gold)" transform="rotate(0)"/>
        <path d="M0 0 L-9 -50 Q0 -56 9 -50 Z" fill="var(--navy)" transform="rotate(60)"/>
        <path d="M0 0 L-9 -50 Q0 -56 9 -50 Z" fill="var(--orange)" transform="rotate(120)"/>
        <path d="M0 0 L-9 -50 Q0 -56 9 -50 Z" fill="var(--sky)" transform="rotate(180)"/>
        <path d="M0 0 L-9 -50 Q0 -56 9 -50 Z" fill="var(--green)" transform="rotate(240)"/>
        <path d="M0 0 L-9 -50 Q0 -56 9 -50 Z" fill="var(--gold)" transform="rotate(300)"/>
      </g>
      <circle cx="0" cy="0" r="7" fill="var(--ink)"/>
    </g>

    <!-- small gear (right) -->
    <g transform="translate(645,135) scale(0.6)">
      <g class="gear-spin-r">
        <circle r="26" fill="var(--gold)"/>
        <circle r="10" fill="var(--cream)"/>
        <g fill="var(--gold)">
          <rect x="-6" y="-38" width="12" height="16" rx="3"/>
          <rect x="-6" y="22" width="12" height="16" rx="3"/>
          <rect x="-38" y="-6" width="16" height="12" rx="3"/>
          <rect x="22" y="-6" width="16" height="12" rx="3"/>
        </g>
      </g>
    </g>

    <!-- steering wheel — bigger, more prominent -->
    <g transform="translate(635,222)">
      <g class="wheel-turn">
        <circle r="36" fill="none" stroke="var(--navy)" stroke-width="11"/>
        <circle r="10" fill="#B98A4E"/>
        <g stroke="#B98A4E" stroke-width="6">
          <line x1="0" y1="0" x2="0" y2="-28"/>
          <line x1="0" y1="0" x2="24" y2="14"/>
          <line x1="0" y1="0" x2="-24" y2="14"/>
        </g>
      </g>
    </g>

    <!-- accent wheel (right) — 6-spoke radial hubcap -->
    <g transform="translate(500,228)">
      <circle r="26" fill="var(--ink)"/>
      <circle r="17" fill="var(--green)"/>
      <g stroke="var(--ink)" stroke-width="2">
        <line x1="0" y1="0" x2="0" y2="-15" transform="rotate(0)"/>
        <line x1="0" y1="0" x2="0" y2="-15" transform="rotate(60)"/>
        <line x1="0" y1="0" x2="0" y2="-15" transform="rotate(120)"/>
        <line x1="0" y1="0" x2="0" y2="-15" transform="rotate(180)"/>
        <line x1="0" y1="0" x2="0" y2="-15" transform="rotate(240)"/>
        <line x1="0" y1="0" x2="0" y2="-15" transform="rotate(300)"/>
      </g>
      <circle r="4" fill="var(--ink)"/>
    </g>

    <!-- bicycle wheel (with dust trail and tread texture) -->
    <g transform="translate(755,150)">
      <g class="dust-trail">
        <circle cx="-95" cy="35" r="20" fill="#E3E6EC"/>
        <circle cx="-120" cy="25" r="15" fill="#EDEFF3"/>
        <circle cx="-70" cy="50" r="16" fill="#D8DBE2"/>
        <circle cx="-140" cy="40" r="12" fill="#EDEFF3"/>
        <circle cx="-100" cy="58" r="13" fill="#CBD0DA"/>
      </g>
      <g class="wheel-spin-slow">
        <circle r="70" fill="none" stroke="var(--ink)" stroke-width="14"/>
        <g fill="var(--ink)">
          <rect x="-3" y="-78" width="6" height="8" transform="rotate(0)"/>
          <rect x="-3" y="-78" width="6" height="8" transform="rotate(45)"/>
          <rect x="-3" y="-78" width="6" height="8" transform="rotate(90)"/>
          <rect x="-3" y="-78" width="6" height="8" transform="rotate(135)"/>
          <rect x="-3" y="-78" width="6" height="8" transform="rotate(180)"/>
          <rect x="-3" y="-78" width="6" height="8" transform="rotate(225)"/>
          <rect x="-3" y="-78" width="6" height="8" transform="rotate(270)"/>
        <rect x="-3" y="-78" width="6" height="8" transform="rotate(315)"/>
      </g>
      <g stroke="var(--slate)" stroke-width="2">
        <line x1="-60" y1="0" x2="60" y2="0"/>
        <line x1="0" y1="-60" x2="0" y2="60"/>
        <line x1="-42" y1="-42" x2="42" y2="42"/>
        <line x1="-42" y1="42" x2="42" y2="-42"/>
      </g>
      <circle r="10" fill="var(--gold)"/>
    </g>
    </g>
  </svg>
  <div class="hero-content">
    <p class="eyebrow" id="eyebrow-text">You're invited</p>
    <h1 class="headline" id="headline-text">It's a birthday!</h1>
    <p class="tagline" id="tagline-text"></p>
    <a href="#rsvp" class="btn">RSVP now</a>
    <div class="hero-photo-mobile" id="hero-photo-mobile" aria-hidden="true">
      <div class="frame-inner">
        <img id="frame-img-m1" alt="">
        <img id="frame-img-m2" alt="">
      </div>
    </div>
  </div>
</header>

<div class="footprints" id="fp-1" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<main class="container">

  <section id="details">
    <h2 class="section-title">Party details</h2>
    <div class="details-grid">
      <div class="detail-card">
        <div class="icon-badge">📅</div>
        <h3>Date</h3>
        <p id="detail-date"></p>
      </div>
      <div class="detail-card">
        <div class="icon-badge">🕐</div>
        <h3>Time</h3>
        <p id="detail-time"></p>
      </div>
      <div class="detail-card">
        <div class="icon-badge">📍</div>
        <h3>Location</h3>
        <a id="detail-location" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </section>

  <div class="footprints" id="fp-2" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <section id="rsvp">
    <h2 class="section-title">RSVP</h2>
    <div class="rsvp-card">
      <p class="form-note" id="rsvp-deadline-note" style="margin-bottom:20px;"></p>
      <form id="rsvp-form">
        <div style="position:absolute; left:-9999px;" aria-hidden="true">
          <label for="website">Leave this field empty</label>
          <input type="text" id="website" name="website" tabindex="-1" autocomplete="off">
        </div>
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label>Will you be joining us?</label>
          <div class="radio-row">
            <label><input type="radio" name="attending" value="Yes" required> Yes</label>
            <label><input type="radio" name="attending" value="No" required> No</label>
          </div>
        </div>
        <div class="field">
          <label for="guests">Number of guests (including you)</label>
          <input type="number" id="guests" name="guests" min="1" value="1">
        </div>
        <div class="field">
          <label for="message">Allergies, notes, or a message</label>
          <textarea id="message" name="message"></textarea>
        </div>
        <p class="form-note" id="rsvp-extra-note"></p>
        <button type="submit" class="btn" id="submit-btn">Send RSVP</button>
        <p class="form-status" id="form-status"></p>
      </form>
    </div>
  </section>

</main>

<footer>
  <p>Made with 🎡 for <span id="footer-name"></span>'s birthday.</p>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
