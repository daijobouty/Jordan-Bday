<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Party</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
  <div class="hero-photo-frame hero-photo-frame-left" id="hero-photo-frame-left" aria-hidden="true">
    <div class="frame-inner">
      <img id="frame-img-c" alt="">
      <img id="frame-img-d" alt="">
    </div>
  </div>
  <div class="hero-photo-frame" id="hero-photo-frame" aria-hidden="true">
    <div class="frame-inner">
      <img id="frame-img-a" alt="">
      <img id="frame-img-b" alt="">
    </div>
  </div>
  <svg class="hero-scene" viewBox="0 0 800 260" aria-hidden="true">
    <!-- confetti dots -->
    <g>
      <circle cx="60" cy="40" r="5" fill="var(--orange)"/>
      <circle cx="140" cy="20" r="4" fill="var(--sky)"/>
      <circle cx="380" cy="30" r="5" fill="var(--gold)"/>
      <circle cx="460" cy="15" r="4" fill="var(--green)"/>
      <circle cx="600" cy="35" r="5" fill="var(--navy)"/>
      <circle cx="20" cy="120" r="4" fill="var(--green)"/>
      <circle cx="780" cy="60" r="5" fill="var(--orange)"/>
    </g>

    <!-- dashed track -->
    <path d="M0 230 Q200 200 400 230 T800 230" stroke="var(--navy)" stroke-width="3" stroke-dasharray="10 10" fill="none" opacity="0.3"/>

    <!-- pinwheel -->
    <g transform="translate(95,110)">
      <g class="pinwheel-l">
        <path d="M0 0 L0 -55 Q35 -55 0 0 Z" fill="var(--sky)"/>
        <path d="M0 0 L55 0 Q55 35 0 0 Z" fill="var(--gold)"/>
        <path d="M0 0 L0 55 Q-35 55 0 0 Z" fill="var(--green)"/>
        <path d="M0 0 L-55 0 Q-55 -35 0 0 Z" fill="var(--orange)"/>
      </g>
      <circle cx="0" cy="0" r="7" fill="var(--navy)"/>
      <rect x="-3" y="0" width="6" height="90" rx="3" fill="#B98A4E"/>
    </g>

    <!-- second pinwheel, opposite spin -->
    <g transform="translate(200,55) scale(0.6)">
      <g class="pinwheel-r">
        <path d="M0 0 L0 -55 Q35 -55 0 0 Z" fill="var(--navy)"/>
        <path d="M0 0 L55 0 Q55 35 0 0 Z" fill="var(--orange)"/>
        <path d="M0 0 L0 55 Q-35 55 0 0 Z" fill="var(--sky)"/>
        <path d="M0 0 L-55 0 Q-55 -35 0 0 Z" fill="var(--green)"/>
      </g>
      <circle cx="0" cy="0" r="7" fill="var(--gold)"/>
    </g>

    <!-- gear -->
    <g transform="translate(300,200)" class="gear-spin">
      <circle r="26" fill="var(--green)"/>
      <circle r="10" fill="var(--cream)"/>
      <g fill="var(--green)">
        <rect x="-6" y="-38" width="12" height="16" rx="3"/>
        <rect x="-6" y="22" width="12" height="16" rx="3"/>
        <rect x="-38" y="-6" width="16" height="12" rx="3"/>
        <rect x="22" y="-6" width="16" height="12" rx="3"/>
      </g>
    </g>

    <!-- accent wheel (left) -->
    <g transform="translate(160,225)">
      <circle r="28" fill="var(--ink)"/>
      <circle r="19" fill="var(--sky)"/>
      <g stroke="var(--ink)" stroke-width="2.5">
        <line x1="-14" y1="0" x2="14" y2="0"/>
        <line x1="0" y1="-14" x2="0" y2="14"/>
        <line x1="-10" y1="-10" x2="10" y2="10"/>
        <line x1="-10" y1="10" x2="10" y2="-10"/>
      </g>
      <circle r="5" fill="var(--ink)"/>
    </g>

    <!-- spinning top -->
    <g transform="translate(470,205)" class="top-wobble">
      <path d="M-22 -20 L22 -20 L10 30 Q0 40 -10 30 Z" fill="var(--orange)"/>
      <rect x="-22" y="-30" width="44" height="12" rx="6" fill="var(--sky)"/>
      <rect x="-4" y="-42" width="8" height="14" rx="4" fill="var(--navy)"/>
    </g>

    <!-- small gear (right) -->
    <g transform="translate(620,120) scale(0.6)" class="gear-spin-r">
      <circle r="26" fill="var(--gold)"/>
      <circle r="10" fill="var(--cream)"/>
      <g fill="var(--gold)">
        <rect x="-6" y="-38" width="12" height="16" rx="3"/>
        <rect x="-6" y="22" width="12" height="16" rx="3"/>
        <rect x="-38" y="-6" width="16" height="12" rx="3"/>
        <rect x="22" y="-6" width="16" height="12" rx="3"/>
      </g>
    </g>

    <!-- accent wheel (right) -->
    <g transform="translate(520,235)">
      <circle r="24" fill="var(--ink)"/>
      <circle r="16" fill="var(--green)"/>
      <g stroke="var(--ink)" stroke-width="2.2">
        <line x1="-12" y1="0" x2="12" y2="0"/>
        <line x1="0" y1="-12" x2="0" y2="12"/>
        <line x1="-8" y1="-8" x2="8" y2="8"/>
        <line x1="-8" y1="8" x2="8" y2="-8"/>
      </g>
      <circle r="4" fill="var(--ink)"/>
    </g>

    <!-- steering wheel -->
    <g transform="translate(590,230)" class="wheel-turn">
      <circle r="30" fill="none" stroke="var(--navy)" stroke-width="9"/>
      <circle r="9" fill="#B98A4E"/>
      <g stroke="#B98A4E" stroke-width="6">
        <line x1="0" y1="0" x2="0" y2="-24"/>
        <line x1="0" y1="0" x2="21" y2="12"/>
        <line x1="0" y1="0" x2="-21" y2="12"/>
      </g>
    </g>

    <!-- bicycle wheel -->
    <g transform="translate(700,150)" class="wheel-spin-slow">
      <circle r="70" fill="none" stroke="var(--ink)" stroke-width="14"/>
      <g stroke="var(--slate)" stroke-width="2">
        <line x1="-60" y1="0" x2="60" y2="0"/>
        <line x1="0" y1="-60" x2="0" y2="60"/>
        <line x1="-42" y1="-42" x2="42" y2="42"/>
        <line x1="-42" y1="42" x2="42" y2="-42"/>
      </g>
      <circle r="10" fill="var(--gold)"/>
    </g>
  </svg>
  <div class="hero-content">
    <p class="eyebrow" id="eyebrow-text">You're invited</p>
    <h1 class="headline" id="headline-text">It's a birthday!</h1>
    <p class="tagline" id="tagline-text"></p>
    <a href="#rsvp" class="btn">RSVP now</a>
  </div>
</header>

<div class="footprints" id="fp-1" aria-hidden="true">
  <span></span><span></span><span></span><span></span><span></span>
</div>

<main class="container">

  <section id="details">
    <h2 class="section-title">Party details</h2>
    <div class="details-grid">
      <div class="detail-card">
        <div class="icon-badge">📅</div>
        <h3>Date</h3>
        <p id="detail-date"></p>
      </div>
      <div class="detail-card">
        <div class="icon-badge">🕐</div>
        <h3>Time</h3>
        <p id="detail-time"></p>
      </div>
      <div class="detail-card">
        <div class="icon-badge">📍</div>
        <h3>Location</h3>
        <a id="detail-location" href="#" target="_blank" rel="noopener"></a>
      </div>
    </div>
  </section>

  <div class="footprints" id="fp-2" aria-hidden="true">
    <span></span><span></span><span></span><span></span><span></span>
  </div>

  <section id="rsvp">
    <h2 class="section-title">RSVP</h2>
    <div class="rsvp-card">
      <p class="form-note" id="rsvp-deadline-note" style="margin-bottom:20px;"></p>
      <form id="rsvp-form">
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="field">
          <label>Will you be joining us?</label>
          <div class="radio-row">
            <label><input type="radio" name="attending" value="Yes" required> Yes</label>
            <label><input type="radio" name="attending" value="No" required> No</label>
          </div>
        </div>
        <div class="field">
          <label for="guests">Number of guests (including you)</label>
          <input type="number" id="guests" name="guests" min="1" value="1">
        </div>
        <div class="field">
          <label for="message">Allergies, notes, or a message</label>
          <textarea id="message" name="message"></textarea>
        </div>
        <p class="form-note" id="rsvp-extra-note"></p>
        <button type="submit" class="btn" id="submit-btn">Send RSVP</button>
        <p class="form-status" id="form-status"></p>
      </form>
    </div>
  </section>

</main>

<footer>
  <p>Made with 🎡 for <span id="footer-name"></span>'s birthday.</p>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
